<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Smart Farming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-card">
            <a href="login.html" class="text-success text-decoration-none fw-bold">Back to Login</a>
            <div class="mt-4 mb-4">
                <span class="badge bg-warning text-dark mb-2">Smart Farming</span>
                <h1 class="h2">Create your account</h1>
                <p class="text-secondary">Enter your name, email and password to register.</p>
            </div>
            <form id="signupForm">
                <div class="mb-3">
                    <label class="form-label" for="signupName">Name</label>
                    <input class="form-control" id="signupName" autocomplete="name" required placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="signupEmail">Email address</label>
                    <input class="form-control" type="email" id="signupEmail" autocomplete="email" required placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="signupPassword">Password</label>
                    <input class="form-control" type="password" id="signupPassword" autocomplete="new-password" minlength="6" required placeholder="Create a password (minimum 6 characters)">
                </div>
                <button class="btn btn-success w-100" type="submit">Register</button>
                <p id="signupMessage" role="status" aria-live="polite"></p>
            </form>
            <p class="mt-3 mb-0 text-center">Already registered? <a href="login.html">Log in</a></p>
            <p class="small text-secondary mt-4 mb-0">Demo account details are saved in this browser only.</p>
        </div>
    </main>
    <script src="account.js"></script>
</body>
</html>
