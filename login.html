<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Smart Farming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-card">
            <div class="mb-4">
                <span class="badge bg-warning text-dark mb-2">Smart Farming</span>
                <h1 class="h2">Welcome back</h1>
                <p class="text-secondary">Log in with your email and password.</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label" for="loginEmail">Email address</label>
                    <input class="form-control" type="email" id="loginEmail" autocomplete="email" required placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input class="form-control" type="password" id="loginPassword" autocomplete="current-password" required placeholder="Enter your password">
                </div>
                <button class="btn btn-success w-100" type="submit">Log In</button>
                <p id="loginMessage" role="status" aria-live="polite"></p>
            </form>
            <p class="mt-3 mb-0 text-center">New here? <a href="signup.html">Create an account</a></p>
            <p class="small text-secondary mt-4 mb-0">Demo accounts are saved in this browser only.</p>
        </div>
    </main>
    <script src="account.js"></script>
</body>
</html>
